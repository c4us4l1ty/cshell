# cshell hyprlock: static wallpaper, no shader (battery), PAM via logind
general {
  hide_cursor = true
  no_fade_in = false
  grace = 5
}
background {
  monitor =
  path = ~/.local/state/sshell/wallpaper/current
  color = rgba(0,0,0,1.0)
  blur_passes = 0
}
input-field {
  monitor =
  size = 300, 50
  dots_center = true
  fade_on_empty = false
  placeholder_text = Password
}
