# Bar — Rust single instance, QML manual fallback only (never both: double bar + triple backlight writers)
exec-once = sh -c 'command -v sshell-rs >/dev/null && exec sshell-rs || (command -v qs >/dev/null && exec qs -c sshell)'
#exec-once = ~/.local/bin/linux-wallpaperengine --silent --screen-root eDP-1 --bg 3479741739

exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dbus-update-activation-environment --all
exec-once = sh -c 'sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &'
# hyprpm reload blocks startup ~2s: background it, never gate login on it
exec-once = sh -c 'command -v hyprpm >/dev/null && (hyprpm reload >/tmp/hyprpm.log 2>&1 &)'

# Idle/lock (battery: lock 300 dpms 330 suspend 600 — see hypridle.conf)
exec-once = sh -c 'command -v hypridle >/dev/null && exec hypridle -c ~/.config/hypr/hypridle.conf &'

# Tray providers (empty tray without these; best-effort, never block)
exec-once = sh -c 'command -v nm-applet >/dev/null && (nm-applet --indicator &)'
exec-once = sh -c 'command -v blueman-applet >/dev/null && (blueman-applet &)'
# Polkit agent (auth dialogs fail without it; polkit-gnome preferred, mate fallback)
exec-once = sh -c '/usr/libexec/polkit-gnome-authentication-agent-1 & || /usr/libexec/mate-polkit/polkit-mate-authentication-agent-1 & || true'

# Clipboard: history (guarded, single daemon; reload-safe)
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && (pidof wl-paste >/dev/null || wl-paste --watch cliphist store &)'

# Cursor (Bibita if present, else Adwaita fallback)
exec-once = sh -c 'hyprctl setcursor Bibita-Modern-Classic 24 2>/dev/null || hyprctl setcursor Adwaita 24 2>/dev/null || true'
