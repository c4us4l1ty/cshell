# Bar, wallpaper — prefer Rust shell, fallback to QML during transition
exec-once = sh -c 'command -v sshell-rs >/dev/null && sshell-rs &'
exec-once = sh -c 'command -v qs >/dev/null && qs -c sshell &'
#exec-once = ~/.local/bin/linux-wallpaperengine --silent --screen-root eDP-1 --bg 3479741739

exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dbus-update-activation-environment --all
exec-once = sh -c 'sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP'
exec-once = sh -c 'command -v hyprpm >/dev/null && hyprpm reload'

# Clipboard: history
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --watch cliphist store &'

# Cursor (Bibita if present, else Adwaita fallback)
exec-once = sh -c 'hyprctl setcursor Bibita-Modern-Classic 24 2>/dev/null || hyprctl setcursor Adwaita 24 2>/dev/null || true'
